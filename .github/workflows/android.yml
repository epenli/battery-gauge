name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Restore release signing identity
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE" && -n "$PASSWORD" ]]; then
            umask 077
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/battery-signing.p12"
            printf '%s' "$PASSWORD" > "$RUNNER_TEMP/battery-signing.password"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/battery-signing.p12" >> "$GITHUB_ENV"
            echo "SIGNING_PASSWORD_FILE=$RUNNER_TEMP/battery-signing.password" >> "$GITHUB_ENV"
          else
            echo 'Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD before releasing.' >&2
            exit 1
          fi
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          version = ET.parse('AndroidManifest.xml').getroot().get('{http://schemas.android.com/apk/res/android}versionName')
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match manifest versionName'
          PY
      - name: Build, test and verify APK
        run: python build.py
      - name: Prepare downloads
        run: |
          mkdir dist
          cp build/battery-gauge.apk dist/battery-gauge.apk
          cd dist
          sha256sum battery-gauge.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: battery-gauge-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/*
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/battery-signing.p12" "$RUNNER_TEMP/battery-signing.password"
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: battery-gauge-${{ github.ref_name }}-${{ github.run_number }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its assets.'
          else
            gh release create "$TAG" dist/* --target "$COMMIT" --title "小哈锂电电池电量 $TAG" --generate-notes --prerelease
          fi
